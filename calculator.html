<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Algebraic Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"></script>
<style>
  :root {
    --bg: #0f1220;
    --panel: #181c2f;
    --panel-2: #222747;
    --text: #e7ebff;
    --muted: #9aa3c7;
    --accent: #7c9cff;
    --accent-2: #5ce1a1;
    --err: #ff6b81;
    --border: #2a2f52;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 20% -10%, #1b2050 0%, transparent 60%), var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 28px 16px 48px;
  }
  .app {
    width: 100%;
    max-width: 880px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    letter-spacing: 0.3px;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  textarea, input[type="text"] {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    resize: vertical;
    outline: none;
  }
  textarea:focus, input:focus { border-color: var(--accent); }
  textarea { min-height: 76px; }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #2b3160; }
  button.primary {
    background: linear-gradient(180deg, #6b8cff, #4f6ef0);
    border-color: #4f6ef0;
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.1); }
  .toolbar { margin-top: 10px; }
  .modes {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .mode {
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .mode.active {
    background: var(--accent);
    color: #0b0f24;
    border-color: var(--accent);
    font-weight: 600;
  }
  .args { display: none; gap: 8px; margin-top: 10px; }
  .args.show { display: flex; }
  .args input { flex: 1; min-width: 80px; }
  .args label { font-size: 12px; color: var(--muted); align-self: center; }
  .history {
    margin-top: 18px;
    max-height: 420px;
    overflow-y: auto;
  }
  .entry {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px;
  }
  .entry:last-child { border-bottom: none; }
  .entry .expr { color: var(--muted); }
  .entry .result { color: var(--accent-2); margin-top: 4px; word-break: break-word; }
  .entry .result.error { color: var(--err); }
  .entry .mode-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 4px;
    background: var(--panel-2);
    color: var(--muted);
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .hint {
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
    line-height: 1.5;
  }
  .hint code {
    background: var(--panel-2);
    padding: 1px 6px;
    border-radius: 4px;
  }
  .clear {
    float: right;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>Algebraic Calculator</h1>
  <div class="sub">Arithmetic, variables, symbolic simplification, derivatives, and equation solving.</div>

  <div class="card">
    <div class="modes" id="modes">
      <button class="mode active" data-mode="eval">Evaluate</button>
      <button class="mode" data-mode="simplify">Simplify</button>
      <button class="mode" data-mode="derivative">Derivative</button>
      <button class="mode" data-mode="solve">Solve</button>
    </div>

    <textarea id="input" placeholder="e.g. 2*(3+4)^2    or    x = 5; x^2 + 1    or    sin(pi/4)"></textarea>

    <div class="args" id="args-derivative">
      <label>w.r.t.</label>
      <input type="text" id="deriv-var" value="x" />
    </div>
    <div class="args" id="args-solve">
      <label>solve for</label>
      <input type="text" id="solve-var" value="x" />
    </div>

    <div class="row toolbar">
      <button class="primary" id="go">Calculate  (↵)</button>
      <button id="clear-input">Clear</button>
      <button data-insert="pi">π</button>
      <button data-insert="e">e</button>
      <button data-insert="sqrt(">√</button>
      <button data-insert="^">^</button>
      <button data-insert="sin(">sin</button>
      <button data-insert="cos(">cos</button>
      <button data-insert="log(">log</button>
      <button data-insert="ln(">ln</button>
    </div>

    <div class="hint">
      <strong>Tips:</strong>
      <code>Enter</code> to run, <code>Shift+Enter</code> for newline.
      Use <code>;</code> to chain (e.g. <code>a = 2; a^3</code>).
      Equations: <code>x^2 - 4 = 0</code>.
    </div>
  </div>

  <div class="card history" id="history-card" style="margin-top: 16px; display:none;">
    <div>
      <strong>History</strong>
      <button class="clear" id="clear-history">Clear</button>
    </div>
    <div id="history"></div>
  </div>
</div>

<script>
  const input = document.getElementById('input');
  const go = document.getElementById('go');
  const clearInput = document.getElementById('clear-input');
  const modesEl = document.getElementById('modes');
  const historyEl = document.getElementById('history');
  const historyCard = document.getElementById('history-card');
  const argsDeriv = document.getElementById('args-derivative');
  const argsSolve = document.getElementById('args-solve');
  const derivVar = document.getElementById('deriv-var');
  const solveVar = document.getElementById('solve-var');
  const clearHistory = document.getElementById('clear-history');

  let mode = 'eval';
  const scope = {};

  function setMode(m) {
    mode = m;
    for (const btn of modesEl.querySelectorAll('.mode')) {
      btn.classList.toggle('active', btn.dataset.mode === m);
    }
    argsDeriv.classList.toggle('show', m === 'derivative');
    argsSolve.classList.toggle('show', m === 'solve');
  }

  modesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode');
    if (btn) setMode(btn.dataset.mode);
  });

  document.querySelectorAll('[data-insert]').forEach(b => {
    b.addEventListener('click', () => {
      const t = b.dataset.insert;
      const start = input.selectionStart, end = input.selectionEnd;
      input.value = input.value.slice(0, start) + t + input.value.slice(end);
      input.selectionStart = input.selectionEnd = start + t.length;
      input.focus();
    });
  });

  clearInput.addEventListener('click', () => { input.value = ''; input.focus(); });
  clearHistory.addEventListener('click', () => {
    historyEl.innerHTML = '';
    historyCard.style.display = 'none';
  });

  function formatResult(v) {
    if (v === undefined || v === null) return '';
    if (typeof v === 'number' || typeof v === 'bigint') return String(v);
    try {
      if (v && typeof v.toString === 'function') return v.toString();
    } catch (e) {}
    return String(v);
  }

  function solveEquation(expr, variable) {
    const sides = expr.split('=');
    let normalized;
    if (sides.length === 2) {
      normalized = `(${sides[0]}) - (${sides[1]})`;
    } else if (sides.length === 1) {
      normalized = expr;
    } else {
      throw new Error('Equation must contain at most one "=" sign.');
    }
    const node = math.simplify(normalized);
    const poly = math.parse(node.toString());
    const coeffs = polynomialCoefficients(poly, variable);
    return solvePolynomial(coeffs, variable);
  }

  function polynomialCoefficients(node, v) {
    const expanded = math.simplify(node, [
      math.simplify.rules[0],
      { l: 'n1*(n2+n3)', r: 'n1*n2+n1*n3' },
      { l: '(n2+n3)*n1', r: 'n2*n1+n3*n1' },
      ...math.simplify.rules
    ]);
    const str = expanded.toString();
    const terms = splitTerms(str);
    const coeffs = {};
    let maxDeg = 0;
    for (const t of terms) {
      const { coeff, deg } = parseTerm(t, v);
      coeffs[deg] = (coeffs[deg] || 0) + coeff;
      if (deg > maxDeg) maxDeg = deg;
    }
    const arr = [];
    for (let i = maxDeg; i >= 0; i--) arr.push(coeffs[i] || 0);
    return arr;
  }

  function splitTerms(s) {
    s = s.replace(/\s+/g, '');
    const out = [];
    let depth = 0, cur = '';
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '(') depth++;
      if (c === ')') depth--;
      if ((c === '+' || c === '-') && depth === 0 && i > 0 && s[i-1] !== '*' && s[i-1] !== '/' && s[i-1] !== '^' && s[i-1] !== '(') {
        out.push(cur);
        cur = c;
      } else {
        cur += c;
      }
    }
    if (cur) out.push(cur);
    return out;
  }

  function parseTerm(t, v) {
    const re = new RegExp(`${v}(?:\\^(\\d+))?`);
    const m = t.match(re);
    if (!m) return { coeff: Number(math.evaluate(t)), deg: 0 };
    const deg = m[1] ? Number(m[1]) : 1;
    const coeffStr = t.replace(re, '').replace(/\*$/, '').replace(/^\*/, '');
    let coeff;
    if (coeffStr === '' || coeffStr === '+') coeff = 1;
    else if (coeffStr === '-') coeff = -1;
    else coeff = Number(math.evaluate(coeffStr));
    return { coeff, deg };
  }

  function solvePolynomial(c, v) {
    const n = c.length - 1;
    if (n === 0) {
      if (c[0] === 0) return [`${v} ∈ ℝ (identity)`];
      return ['no solution'];
    }
    if (n === 1) {
      return [`${v} = ${fmt(-c[1] / c[0])}`];
    }
    if (n === 2) {
      const [a, b, d] = c;
      const disc = b * b - 4 * a * d;
      if (disc > 0) {
        const r1 = (-b + Math.sqrt(disc)) / (2 * a);
        const r2 = (-b - Math.sqrt(disc)) / (2 * a);
        return [`${v} = ${fmt(r1)}`, `${v} = ${fmt(r2)}`];
      } else if (disc === 0) {
        return [`${v} = ${fmt(-b / (2 * a))} (double)`];
      } else {
        const re = -b / (2 * a);
        const im = Math.sqrt(-disc) / (2 * a);
        return [`${v} = ${fmt(re)} + ${fmt(im)}i`, `${v} = ${fmt(re)} - ${fmt(im)}i`];
      }
    }
    return numericRoots(c, v);
  }

  function numericRoots(c, v) {
    const f = (x) => c.reduce((acc, k, i) => acc + k * Math.pow(x, c.length - 1 - i), 0);
    const roots = [];
    let prev = f(-1000), prevX = -1000;
    for (let x = -999; x <= 1000; x++) {
      const y = f(x);
      if (y === 0) roots.push(x);
      else if (prev * y < 0) {
        let lo = prevX, hi = x;
        for (let k = 0; k < 60; k++) {
          const mid = (lo + hi) / 2;
          if (f(lo) * f(mid) < 0) hi = mid; else lo = mid;
        }
        roots.push((lo + hi) / 2);
      }
      prev = y; prevX = x;
    }
    if (!roots.length) return ['no real root found in [-1000, 1000]'];
    return roots.map(r => `${v} ≈ ${fmt(r)}`);
  }

  function fmt(n) {
    if (!isFinite(n)) return String(n);
    const rounded = Math.round(n * 1e10) / 1e10;
    return String(rounded);
  }

  function run() {
    const raw = input.value.trim();
    if (!raw) return;
    let resultText = '';
    let isError = false;
    try {
      if (mode === 'eval') {
        const out = math.evaluate(raw, scope);
        if (Array.isArray(out)) resultText = out.map(formatResult).join('\n');
        else resultText = formatResult(out);
      } else if (mode === 'simplify') {
        resultText = math.simplify(raw).toString();
      } else if (mode === 'derivative') {
        const v = derivVar.value.trim() || 'x';
        resultText = math.derivative(raw, v).toString();
      } else if (mode === 'solve') {
        const v = solveVar.value.trim() || 'x';
        const sols = solveEquation(raw, v);
        resultText = sols.join('\n');
      }
    } catch (err) {
      resultText = err.message || String(err);
      isError = true;
    }
    addHistory(raw, resultText, isError);
  }

  function addHistory(expr, result, isError) {
    historyCard.style.display = 'block';
    const div = document.createElement('div');
    div.className = 'entry';
    const tag = document.createElement('span');
    tag.className = 'mode-tag';
    tag.textContent = mode;
    const e = document.createElement('div');
    e.className = 'expr';
    e.appendChild(tag);
    e.appendChild(document.createTextNode(expr));
    const r = document.createElement('div');
    r.className = 'result' + (isError ? ' error' : '');
    r.textContent = result;
    div.appendChild(e);
    div.appendChild(r);
    historyEl.prepend(div);
  }

  go.addEventListener('click', run);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      run();
    }
  });

  input.focus();
</script>
</body>
</html>
